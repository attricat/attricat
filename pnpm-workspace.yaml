packages:
  - apps/web
  - apps/docs

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@remote-dom/core@1.12.1'
  - '@remote-dom/polyfill@1.7.0'

overrides:
  # monaco-editor pins a release with known sanitizer bypasses.
  dompurify: '>=3.4.17'
