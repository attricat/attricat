packages:
  - apps/web
  - apps/docs

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@remote-dom/core@1.12.1'
  - '@remote-dom/polyfill@1.7.0'

overrides:
  # monaco-editor pins a release with known sanitizer bypasses.
  dompurify: '>=3.4.17'
  # testcontainers 12.2 still needs archiver 7, whose archiver-utils 5.0.2
  # requires glob 10 (GHSA-3g3m-2fjr-6pw4, and minimatch 9 GHSA-g3hv-75wg-m249).
  # archiver-utils only calls `glob.sync`, which glob 14 keeps. Remove once
  # testcontainers depends on an archiver without archiver-utils 5.
  archiver-utils>glob: '^14.0.2'
