format_version = 1
code = "product"
name = "{{Product}}"
kind = "record"

# Lexicon references such as {{Product}} fall back to their English text.
# Requiredness belongs to the record; value constraints belong to attributes.
record_schema = '{"type":"object","required":["name","sku","price","status"]}'

[views.dropdown_option]
type = "dropdown_option"
fields = ["name", "sku"]
separator = " / "

[views.detail]
type = "stack"
children = [
  { type = "stack", component = { id = "attricat.record_heading", version = 1 }, children = [
    { type = "field", field = "name" },
    { type = "field", field = "sku" },
    { type = "field", field = "status" },
  ] },
  { type = "tabs", tabs = [
    { label = "{{Overview}}", children = [
      { type = "grid", children = [
        { type = "field", field = "price" },
        { type = "field", field = "color", component = { id = "attricat.color_display", version = 1 } },
        { type = "field", field = "website", component = { id = "attricat.url_display", version = 1 } },
      ] },
      { type = "field", field = "description", component = { id = "attricat.markdown_display", version = 1 } },
    ] },
    { label = "{{Images}}", children = [
      { type = "field", field = "main_photo" },
      { type = "field", field = "product_images" },
    ] },
  ] },
]

[views.table]
type = "table"
columns = [
  { field = "main_photo", renderer = { id = "attricat.table_image", version = 1 } },
  { field = "name" },
  { field = "sku" },
  { field = "price" },
  { field = "status" },
  { field = "color", renderer = { id = "attricat.color_display", version = 1 } },
]

[[attributes]]
code = "name"
name = "{{Name}}"
value_type = "string"
value_schema = '{"type":"string","minLength":1,"maxLength":200}'

[[attributes]]
code = "sku"
name = "SKU"
value_type = "string"
# Identifiers are shared across contexts and edited only in the default one.
context_editable = "default"
value_schema = '{"type":"string","pattern":"^[A-Z0-9][A-Z0-9_-]{0,63}$"}'

[[attributes]]
code = "price"
name = "{{Price}}"
value_type = "number"
value_schema = '{"type":"number","minimum":0}'

[[attributes]]
code = "status"
name = "{{Status}}"
value_type = "string"
default_value = "draft"
context_editable = "default"
# Status controls and transitions apply automatically in every view.
# This is a product lifecycle, independent of channel publication.
value_schema = '''{
  "type": "string",
  "enum": ["draft", "active", "retired"],
  "x-attricat-status": {
    "version": 1,
    "options": [
      { "code": "draft", "label": "Draft", "tone": "info" },
      { "code": "active", "label": "Active", "tone": "success" },
      { "code": "retired", "label": "Retired", "tone": "warning" }
    ],
    "transitions": [
      { "from": null, "to": "draft" },
      { "from": "draft", "to": "active" },
      { "from": "active", "to": "draft" },
      { "from": "active", "to": "retired" },
      { "from": "retired", "to": "draft" }
    ]
  }
}'''

[[attributes]]
code = "description"
name = "{{Description}}"
value_type = "string"

[[attributes]]
code = "color"
name = "{{Color}}"
value_type = "string"
# Controls guide form input; schemas also protect API/CLI writes.
value_schema = '{"type":"string","pattern":"^#[0-9A-Fa-f]{6}$"}'

[[attributes]]
code = "website"
name = "{{Product website}}"
value_type = "string"
value_schema = '{"type":"string","format":"uri","pattern":"^https?://"}'

# A single image can be used as an Explorer table thumbnail.
[[attributes]]
code = "main_photo"
name = "{{Main photo}}"
value_type = "file"
cardinality = "one"
allowed_mime_groups = ["image"]
allowed_extensions = ["jpg", "jpeg", "png", "webp"]
max_bytes = 10485760
purposes = ["product_image"]
image_only = true

[[attributes]]
code = "product_images"
name = "{{Gallery}}"
value_type = "file"
cardinality = "many"
ordered = true
allowed_mime_groups = ["image"]
allowed_extensions = ["jpg", "jpeg", "png", "webp"]
max_bytes = 10485760
purposes = ["product_image"]
image_only = true
