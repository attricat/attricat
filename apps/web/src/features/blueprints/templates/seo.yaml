format_version: 1
code: seo
name: SEO
kind: mixin

attributes:
  # Select these attributes through a version-pinned include in a record blueprint.
  # The consuming record owns views and requiredness; these constraints travel
  # with each selected attribute. Length limits are editorial guidelines.
  - code: meta_title
    name: '{{SEO title}}'
    value_type: string
    value_schema: '{"type":"string","minLength":1,"maxLength":60}'

  - code: meta_description
    name: '{{SEO description}}'
    value_type: string
    value_schema: '{"type":"string","minLength":1,"maxLength":160}'

  - code: canonical_url
    name: '{{Canonical URL}}'
    value_type: string
    # Use attricat.url_edit / attricat.url_display in the consuming record's views.
    value_schema: '{"type":"string","format":"uri","pattern":"^https?://"}'
    # Do not inherit a different locale's canonical URL.
    context_fallback: none

  - code: no_index
    name: '{{Exclude from search engines}}'
    value_type: boolean
    default_value: false
