code: review_status
name: Review status
value_type: string
default_value: draft

# Offered as a filter in the Explorer.
searchable: true
facetable: true

# Identical in every context, and edited only in the default one.
context_editable: default

value_schema:
  type: string
  enum: [draft, in_review, approved]
  # Each status code gets a label and an optional colour tone.
  x-attricat-status:
    version: 1
    options:
      - { code: draft, label: Draft }
      - { code: in_review, label: In review, tone: info }
      - { code: approved, label: Approved, tone: success }
