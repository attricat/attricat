[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
async-recursion = "1"
async-trait = "0.1"
axum = "0.8"
argon2 = "0.5"
base64 = "0.22"
catalog-blueprint = { path = "../../crates/blueprint" }
catalog-validation = { path = "../../crates/validation" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
rand = "0.8"
rust_decimal = { version = "1", features = ["serde"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "rust_decimal", "uuid"] }
subtle = "2.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
