# Policy consumed by `cargo deny check` in CI.
[advisories]
version = 2
yanked = "deny"
ignore = [
  # Marvin: timing can recover an RSA private key during private-key operations.
  # rsa has no fixed release. It comes in through openidconnect, which production
  # uses only to verify provider signatures with public keys; Attricat holds no
  # RSA private key. Only the test provider signs with rsa, using a throwaway key.
  { id = "RUSTSEC-2023-0071", reason = "only public-key verification in production" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "AGPL-3.0-only",
  "0BSD",
  "Unicode-3.0",
  "Zlib",
]

# rust-s3 -> aws-creds -> rust-ini -> dlv-list -> const-random -> tiny-keccak.
[[licenses.exceptions]]
name = "tiny-keccak"
allow = ["CC0-1.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
