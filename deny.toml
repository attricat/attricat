# Policy consumed by `cargo deny check` in CI.
[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "0BSD",
  "Unicode-3.0",
  "Zlib",
]

# Workspace crates are unpublished and have no repository LICENSE; audit only
# third-party licenses until a project license is adopted.
[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
