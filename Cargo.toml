[workspace]
members = ["apps/api", "apps/catalog-cli", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
async-recursion = "1"
async-stream = "0.3"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio"] }
axum = { version = "0.8", features = ["multipart"] }
argon2 = "0.5"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
cron = "0.15"
dotenvy = "0.15"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jsonschema = { version = "0.49", default-features = false }
kamadak-exif = "0.6"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
quick-xml = "0.41"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust_decimal = { version = "1", features = ["serde"] }
secrecy = "0.10"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "rust_decimal", "uuid"] }
subtle = "2.6"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs"] }
toml = "0.8"
tracing = "0.1"
tracing-opentelemetry = "0.33"
unicode-normalization = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
wasmtime = { version = "48", default-features = false, features = ["async", "component-model", "cranelift", "runtime"] }
wit-bindgen = "0.57"
zstd = "0.13"
