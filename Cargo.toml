[workspace]
members = ["apps/api", "apps/cli", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
repository = "https://github.com/attricat/attricat"
edition = "2024"
rust-version = "1.96.0"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
argon2 = "0.5"
base64 = "0.22"
bytes = "1"
calamine = { version = "0.37", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
cron = "0.15"
dotenvy = "0.15"
futures-util = "0.3"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jsonschema = { version = "0.49", default-features = false }
kamadak-exif = "0.6"
lopdf = { version = "0.46", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
metrics = "0.23"
# Only the recorder; the HTTP listener and push gateway pull in a second TLS stack.
metrics-exporter-prometheus = { version = "0.15", default-features = false }
moka = "0.12"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
quick-xml = "0.41"
rand = "0.8"
regex = "1"
openidconnect = { version = "4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
# TLS comes from the workspace's reqwest (rustls with ring). The crate's TLS
# features also pull in a blocking HTTP client for credential sources that
# Attricat never uses.
rust-s3 = { version = "0.38", default-features = false, features = ["fail-on-err", "with-tokio"] }
rust_decimal = { version = "1", features = ["serde"] }
schemars = "1"
secrecy = "0.10"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ring = "0.17"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "rust_decimal", "uuid"] }
subtle = "2.6"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["catch-panic", "fs"] }
serde-saphyr = "2.0.0"
granit-parser = { version = "2.0.0", default-features = false, features = ["comments", "std"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
unicode-normalization = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
wasmtime = { version = "49", default-features = false, features = ["async", "component-model", "cranelift", "runtime"] }
webp = { version = "0.3", default-features = false }
wit-bindgen = "0.57"
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.14"

# Dependencies keep only line tables, which still give panic and backtrace
# locations, so every linked test binary stays small.
[profile.dev.package."*"]
debug = "line-tables-only"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
