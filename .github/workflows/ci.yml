name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d catalog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo deny check

  release-path:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment definitions
        env:
          ATTRICAT_IMAGE: attricat:ci
          ATTRICAT_ENV_FILE: .env.production.example
        run: |
          bash -n scripts/docker-entrypoint.sh scripts/operations.sh scripts/verify-deployment.sh
          docker compose -f deploy/compose.yml config >/dev/null
          docker compose -f deploy/compose.ci.yml config >/dev/null
      - name: Build and exercise release image and rollback
        env:
          ATTRICAT_IMAGE: attricat:ci
        run: scripts/verify-deployment.sh
      - name: Publish immutable commit image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          target="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker tag attricat:ci "$target"
          docker push "$target"
          docker image inspect --format 'published={{index .RepoDigests 0}}' "$target" | tee -a deployment-evidence/result.txt
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.sha }}
          path: |
            deployment-evidence/
            deploy/compose.yml
            deploy/compose.ci.yml
          if-no-files-found: warn
