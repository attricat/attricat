name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Version tags do not run CI: release-image.yml re-tags the image this
    # workflow already verified and published for the tagged commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attricat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attricat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/attricat
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo deny check

  rust-test:
    # Running the tests, mostly the API's database-backed integration suite,
    # outlasts compiling them, so each slice runs a third on its own runner
    # and database; see scripts/ci-rust-tests.sh.
    name: rust-test (${{ matrix.slice }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attricat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attricat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/attricat
      # Three of the runner's four cores, as release-binaries uses for a
      # heavier optimised build.
      CARGO_BUILD_JOBS: 3
      CARGO_INCREMENTAL: 0
      # Compiling the workspace again, not running it, now takes most of
      # each slice, and debug info is much of a debug build. Panics keep
      # their file and line; only backtraces lose line numbers.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # rust-cache keeps dependencies, but cargo judges our own crates by
      # file times, which every checkout resets. sccache caches each
      # library crate by the hash of its sources (including files macros
      # read, such as the embedded migrations) and flags, so unchanged
      # crates are not compiled again. Linked crates, such as test
      # executables, always compile.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: taiki-e/install-action@wasm-tools
      - name: Record initial disk usage
        run: df -h
      - run: scripts/ci-rust-tests.sh ${{ matrix.slice }} ${{ strategy.job-total }}
      - name: Show compiler cache hits
        if: always()
        run: sccache --show-stats
      - name: Record final disk usage
        if: always()
        run: |
          df -h
          du -sh target 2>/dev/null || true

  extension-scaffold:
    # `acli extension new` pins SDK release tarballs; this catches a stale pin
    # and any drift between the templates, the SDK and the host's validation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasm-tools
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: corepack enable
      - run: cargo build --locked -p acli
      - run: target/debug/acli extension new "$RUNNER_TEMP/scaffold" --id acme.scaffold --name Scaffold --with-server
      - name: Build, test and pack the new extension
        working-directory: ${{ runner.temp }}/scaffold
        run: |
          pnpm install
          pnpm test
          pnpm package
      - run: target/debug/acli extension validate "$RUNNER_TEMP/scaffold/dist/acme.scaffold-0.1.0.tar.zst"

  # Kept out of `release-path`: a new advisory should not stop an unrelated
  # release, and this needs the registry to answer.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: corepack enable
      - run: pnpm audit --prod --audit-level=high

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web format:check
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web inspect:bundle
      - run: pnpm --dir apps/docs build

  e2e:
    # Each part runs its own stack, database and browser on its own runner,
    # so the specs need not be independent within a shared server. Shards
    # split the specs by count in file order, so the language sweep, as long
    # as a shard, runs as a part of its own instead of loading one shard.
    name: e2e (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1/3
            args: --project=chromium --project=mobile-chromium --shard=1/3
          - part: 2/3
            args: --project=chromium --project=mobile-chromium --shard=2/3
          - part: 3/3
            args: --project=chromium --project=mobile-chromium --shard=3/3
          - part: language sweep
            args: --project=language-sweep
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      # Shares rust-test's compiled library crates; see there.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      # Global setup side-loads the example extension, built from its own
      # repository rather than a sibling checkout.
      ATTRICAT_EXTENSION_EXAMPLE_DIR: ${{ github.workspace }}/.e2e/attricat-extension-example
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: attricat/attricat-extension-example
          path: .e2e/attricat-extension-example
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            .e2e/attricat-extension-example -> target
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-tools
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: .e2e/attricat-extension-example
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      # Build the API before Playwright starts it, so the server start-up wait
      # in global setup does not include compilation.
      - run: cargo build --locked -p api --bins
      - name: Show compiler cache hits
        run: sccache --show-stats
      - run: node scripts/test-e2e.mjs ${{ matrix.args }}
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ strategy.job-index }}
          path: apps/web/test-results/
          retention-days: 7

  release-binaries:
    # Compiles the image's release binaries while the checks run, with a cargo
    # cache that persists between runs, so release-path only packs them.
    # Compiling inside the image build started from nothing every time.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      # Matches the image's own build settings. Cranelift is memory hungry,
      # but three jobs fit the runner's 16 GB where the image build uses one.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 1
      CARGO_BUILD_JOBS: 3
      # What the API reports it was built from, as the image build passes it.
      ATTRICAT_BUILD_COMMIT: ${{ github.sha }}
      ATTRICAT_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p api --bins -p acli --bin acli
      - run: |
          mkdir -p release-binaries
          cp target/release/api target/release/file-worker target/release/migrate target/release/acli release-binaries/
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ github.sha }}
          path: release-binaries/
          retention-days: 1
          if-no-files-found: error

  release-path:
    # Publishing below must never outrun a failing check of the same commit.
    needs: [rust-quality, rust-test, extension-scaffold, web, e2e, release-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Serialize release runs per ref so an older main build cannot move
    # `latest` after a newer one has published.
    concurrency:
      group: release-path-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Validate deployment definitions
        env:
          ATTRICAT_IMAGE: attricat:ci
          ATTRICAT_ENV_FILE: .env.production.example
        run: |
          bash -n scripts/docker-entrypoint.sh scripts/verify-deployment.sh
          docker compose -f deploy/compose.yml config >/dev/null
          docker compose -f deploy/compose.ci.yml config >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries-${{ github.sha }}
          path: release-binaries
      - name: Build and exercise release image and rollback
        env:
          ATTRICAT_IMAGE: attricat:ci
          ATTRICAT_PREBUILT_BINARIES: release-binaries
        run: scripts/verify-deployment.sh
      - name: Publish commit and latest images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          target="$repository:$GITHUB_SHA"
          docker tag attricat:ci "$target"
          docker push "$target"
          # `latest` is a moving convenience tag; deployments still pin the digest.
          docker tag attricat:ci "$repository:latest"
          docker push "$repository:latest"
          docker image inspect --format 'published={{index .RepoDigests 0}}' "$target" | tee -a deployment-evidence/result.txt
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.sha }}
          path: |
            deployment-evidence/
            deploy/compose.yml
            deploy/compose.ci.yml
          if-no-files-found: warn
