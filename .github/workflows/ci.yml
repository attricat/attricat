name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Version tags rebuild, verify and publish the image as that release.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attricat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attricat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/attricat
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo deny check

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attricat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attricat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/attricat
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasm-tools
      - name: Record initial disk usage
        run: df -h
      - run: cargo test --locked --workspace
      - name: Record final disk usage
        if: always()
        run: |
          df -h
          du -sh target 2>/dev/null || true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web format:check
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web inspect:bundle
      - run: pnpm --dir apps/docs build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      # Global setup side-loads the example extension, built from its own
      # repository rather than a sibling checkout.
      ATTRICAT_EXTENSION_EXAMPLE_DIR: ${{ github.workspace }}/.e2e/attricat-extension-example
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: attricat/attricat-extension-example
          path: .e2e/attricat-extension-example
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            .e2e/attricat-extension-example -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-tools
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: .e2e/attricat-extension-example
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      # Build the API before Playwright starts it, so the server start-up wait
      # in global setup does not include compilation.
      - run: cargo build --locked -p api --bins
      - run: node scripts/test-e2e.mjs
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7

  release-path:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Serialize release runs per ref so an older main build cannot move
    # `latest` after a newer one has published.
    concurrency:
      group: release-path-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Validate deployment definitions
        env:
          ATTRICAT_IMAGE: attricat:ci
          ATTRICAT_ENV_FILE: .env.production.example
        run: |
          bash -n scripts/docker-entrypoint.sh scripts/verify-deployment.sh
          docker compose -f deploy/compose.yml config >/dev/null
          docker compose -f deploy/compose.ci.yml config >/dev/null
      - name: Build and exercise release image and rollback
        env:
          ATTRICAT_IMAGE: attricat:ci
        run: scripts/verify-deployment.sh
      - name: Publish commit and latest images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          target="$repository:$GITHUB_SHA"
          docker tag attricat:ci "$target"
          docker push "$target"
          # `latest` is a moving convenience tag; deployments still pin the digest.
          docker tag attricat:ci "$repository:latest"
          docker push "$repository:latest"
          docker image inspect --format 'published={{index .RepoDigests 0}}' "$target" | tee -a deployment-evidence/result.txt
      - name: Publish release images
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          workspace_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$version" != "$workspace_version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $workspace_version" >&2
            exit 1
          fi
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("$version")
          # Pre-releases get only their exact tag. Before 1.0 a minor release may
          # break compatibility, so `0` would not be a meaningful channel.
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags+=("${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
            [[ "${BASH_REMATCH[1]}" != 0 ]] && tags+=("${BASH_REMATCH[1]}")
          fi
          for tag in "${tags[@]}"; do
            docker tag attricat:ci "$repository:$tag"
            docker push "$repository:$tag"
          done
          docker image inspect --format 'published={{index .RepoDigests 0}}' "$repository:$version" | tee -a deployment-evidence/result.txt
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.sha }}
          path: |
            deployment-evidence/
            deploy/compose.yml
            deploy/compose.ci.yml
          if-no-files-found: warn
