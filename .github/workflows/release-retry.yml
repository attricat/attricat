# Re-runs a Release run whose only failures are jobs that never started, such
# as a macOS build cancelled because no runner picked it up. release.yml is
# generated by dist, so the retry lives here. A job that ran and failed is left
# for a person to look at.
name: Release retry

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    # The first two attempts are retried, so a run gets at most three.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Re-run jobs that never started
        run: |
          failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" \
            --paginate --jq '[.jobs[]
              | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
              | {name, conclusion, steps: (.steps | length)}]' | jq -s 'add')"
          echo "$failed"
          if echo "$failed" | jq -e 'length > 0 and all(.conclusion == "cancelled" and .steps == 0)' >/dev/null; then
            echo "Only jobs that never started failed; re-running them."
            gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
          else
            echo "A job ran and failed; not retrying."
          fi
