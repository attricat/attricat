format_version = 1
code = "category"
name = "Category"
kind = "entity"

attributes = [
  { code = "name", value_type = "string" },
  { code = "slug", value_type = "string" },
]

[display.dropdown_option]
fields = ["name"]

[views.detail]
type = "stack"
children = [
  { type = "heading", text = "Category" },
  { type = "field", field = "name" },
  { type = "field", field = "slug" },
]

[views.edit]
type = "stack"
children = [
  { type = "field", field = "name" },
  { type = "field", field = "slug" },
]

[views.table]
type = "table"
fields = ["name", "slug"]
