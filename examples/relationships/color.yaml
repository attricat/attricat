format_version: 1
code: color
name: Color
kind: record

attributes:
  - code: name
    value_type: string

  - code: hex
    value_type: string

views:
  dropdown_option:
    type: dropdown_option
    fields: [name, hex]
  detail:
    type: stack
    children:
      - {type: heading, text: Color}
      - {type: field, field: name}
      - {type: field, field: hex}
  table:
    type: table
    columns:
      - {field: name}
      - {field: hex}
