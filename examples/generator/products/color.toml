format_version = 1
code = "color"
name = "Color"
kind = "entity"

[views.dropdown_option]
type = "dropdown_option"
fields = ["name", "hex"]
separator = " / "

[views.detail]
type = "stack"
children = [
  { type = "heading", text = "Color" },
  { type = "field", field = "name" },
  { type = "incoming_relationship_list", label = "Products in this color", page_size = 25, relationships = [{ source_blueprint = "product", field = "colors" }], component = { id = "catalog.incoming_relationship_list_display", version = 1 } },
]

[views.edit]
type = "stack"
children = [{ type = "field", field = "name" }, { type = "field", field = "hex" }]

[views.table]
type = "table"
fields = ["name", "hex"]

[[attributes]]
code = "name"
value_type = "string"

[[attributes]]
code = "hex"
value_type = "string"
