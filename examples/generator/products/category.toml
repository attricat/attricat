format_version = 1
code = "category"
name = "Category"
kind = "entity"

[views.dropdown_option]
type = "dropdown_option"
fields = ["name", "slug"]
separator = " / "

[views.detail]
type = "stack"
children = [
  { type = "heading", text = "Category" },
  { type = "relationship_list", field = "parent_category", component = { id = "catalog.relationship_hierarchy", version = 1 } },
  { type = "field", field = "name" },
  { type = "incoming_relationship_list", label = "Products in this category", page_size = 25, relationships = [{ source_blueprint = "product", field = "categories" }], component = { id = "catalog.incoming_relationship_list_display", version = 1 } },
]

[views.edit]
type = "stack"
children = [{ type = "field", field = "name" }, { type = "field", field = "slug" }]

[views.table]
type = "table"
fields = ["name", "slug"]

[[attributes]]
code = "name"
value_type = "string"
tags = ["searchable"]

[[attributes]]
code = "parent_category"
value_type = "relationship"
target_blueprint = "category"
context_fallback = "none"

[[attributes]]
code = "slug"
value_type = "string"
