name: attricat

x-app: &app
  image: ${ATTRICAT_IMAGE:?Set ATTRICAT_IMAGE to an immutable tag or digest}
  env_file:
    - path: ${ATTRICAT_ENV_FILE:-.env.production}
      required: true
  # Secrets are files, never environment variables. Each role loads the same
  # configuration, so each receives every secret.
  secrets:
    - database_url
    - s3_secret_access_key
    - smtp_password
    - llm_api_key
    - redis_url
    - bootstrap_owner_password
    - file_worker_metrics_token
    - extension_credential_key
    - identity_provider_credential_key
    - operator_api_token
    - api_metrics_token
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${ATTRICAT_BIND_IP:-127.0.0.1}:${ATTRICAT_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  file-worker:
    <<: *app
    command: ["file-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      FILE_WORKER_OPERATIONS_BIND_ADDR: 0.0.0.0:3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3001/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

# Every file must exist and be readable by uid 10001; an empty file leaves an
# optional secret unset. See the Operate section of the docs site.
secrets:
  database_url:
    file: ${ATTRICAT_SECRETS_HOST_DIR:-./secrets}/database_url
  s3_secret_access_key:
    file: ${ATTRICAT_SECRETS_HOST_DIR:-./secrets}/s3_secret_access_key
  smtp_password:
    file: ${ATTRICAT_SECRETS_HOST_DIR:-./secrets}/smtp_password
  llm_api_key:
    file: ${ATTRICAT_SECRETS_HOST_DIR:-./secrets}/llm_api_key
  redis_url:
    file: ${ATTRICAT_SECRETS_HOST_DIR:-./secrets}/redis_url
  bootstrap_owner_password:
    file: ${ATTRICAT_SECRETS_HOST_DIR:-./secrets}/bootstrap_owner_password
  file_worker_metrics_token:
    file: ${ATTRICAT_SECRETS_HOST_DIR:-./secrets}/file_worker_metrics_token
  extension_credential_key:
    file: ${ATTRICAT_SECRETS_HOST_DIR:-./secrets}/extension_credential_key
  identity_provider_credential_key:
    file: ${ATTRICAT_SECRETS_HOST_DIR:-./secrets}/identity_provider_credential_key
  operator_api_token:
    file: ${ATTRICAT_SECRETS_HOST_DIR:-./secrets}/operator_api_token
  api_metrics_token:
    file: ${ATTRICAT_SECRETS_HOST_DIR:-./secrets}/api_metrics_token
