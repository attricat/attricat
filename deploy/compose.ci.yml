name: attricat-release-test

x-app: &app
  secrets:
    - database_url
    - s3_secret_access_key
    - bootstrap_owner_password
    - file_worker_metrics_token
    - api_metrics_token
    - identity_provider_credential_key
  # The certificate authority verify-deployment.sh creates for the identity provider.
  volumes:
    - ./ci-tls/ca.pem:/run/idp-ca.pem:ro
    - /var/tmp/attricat
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  stop_grace_period: 45s
  security_opt:
    - no-new-privileges:true

x-environment: &environment
  TMPDIR: /var/tmp/attricat
  ATTRICAT_AUTO_MIGRATE: "false"
  ATTRICAT_BOOTSTRAP_OWNER_EMAIL: owner@example.test
  SESSION_COOKIE_SECURE: "false"
  ATTRICAT_DEVTOOLS: "false"
  S3_ENDPOINT: http://rustfs:9000
  S3_REGION: us-east-1
  S3_BUCKET: attricat-files
  S3_ACCESS_KEY_ID: attricat-ci
  S3_FORCE_PATH_STYLE: "true"
  S3_UPLOAD_TIMEOUT_SECONDS: "10"
  S3_DOWNLOAD_TIMEOUT_SECONDS: "10"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_TLS_MODE: disabled
  MAIL_FROM: Attricat <no-reply@example.test>
  PASSWORD_RESET_URL: http://127.0.0.1:3000/password-reset/confirm
  WORKSPACE_INVITATION_URL: http://127.0.0.1:3000/invitations/accept
  WORKSPACE_ONBOARDING_URL: http://127.0.0.1:3000/onboarding
  OIDC_CALLBACK_URL: http://127.0.0.1:3000/api/auth/oidc/callback
  OIDC_ALLOWED_PRIVATE_HOSTS: idp.test
  OIDC_CA_FILE: /run/idp-ca.pem

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: attricat
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attricat"]
      interval: 2s
      timeout: 3s
      retries: 30
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: attricat-ci
      RUSTFS_SECRET_KEY: attricat-ci-secret
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/health/live >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
  rustfs-init:
    image: amazon/aws-cli:2.31.0
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: attricat-ci
      AWS_SECRET_ACCESS_KEY: attricat-ci-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for bucket in attricat-files; do
          aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1 ||
            aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$bucket"
        done
  mailpit:
    image: axllent/mailpit:v1.28
  # A real identity provider over TLS, as production requires.
  idp:
    image: quay.io/keycloak/keycloak:26.4.2
    command:
      - start-dev
      - --import-realm
      - --http-enabled=false
      - --https-port=8443
      - --https-certificate-file=/tls/idp.pem
      - --https-certificate-key-file=/tls/idp.key
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: https://idp.test:8443
    ports: ["127.0.0.1:8443:8443"]
    networks:
      default:
        aliases: [idp.test]
    volumes:
      - ../apps/api/dev/keycloak-acme-realm.json:/opt/keycloak/data/import/acme-realm.json:ro
      - ./ci-tls:/tls:ro

  migrate:
    <<: *app
    image: ${ATTRICAT_IMAGE:-attricat:ci}
    command: ["migrate"]
    environment: *environment
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
  api:
    <<: *app
    image: ${ATTRICAT_IMAGE:-attricat:ci}
    command: ["api"]
    environment: *environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["${ATTRICAT_BIND_IP:-0.0.0.0}:3000:3000"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
  file-worker:
    <<: *app
    image: ${ATTRICAT_IMAGE:-attricat:ci}
    command: ["file-worker"]
    environment:
      <<: *environment
      FILE_WORKER_OPERATIONS_BIND_ADDR: 0.0.0.0:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3001/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

# Disposable test credentials, committed on purpose.
secrets:
  database_url:
    file: ./ci-secrets/database_url
  s3_secret_access_key:
    file: ./ci-secrets/s3_secret_access_key
  bootstrap_owner_password:
    file: ./ci-secrets/bootstrap_owner_password
  file_worker_metrics_token:
    file: ./ci-secrets/file_worker_metrics_token
  api_metrics_token:
    file: ./ci-secrets/api_metrics_token
  identity_provider_credential_key:
    file: ./ci-secrets/identity_provider_credential_key
