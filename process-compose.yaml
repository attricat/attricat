version: "0.5"

processes:
  api:
    command: watchexec --restart --watch apps/api --watch crates --exts rs,toml -- cargo run -p api --bin api
  file-worker:
    command: watchexec --restart --watch apps/api --watch crates --exts rs,toml -- cargo run -p api --bin file-worker
  web:
    command: pnpm --dir apps/web exec vite --host --port $WEB_PORT
  docs:
    command: pnpm --dir apps/docs dev --host 0.0.0.0 --port $DOCS_PORT
